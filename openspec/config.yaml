schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  Langue obligatoire: francais (fr-FR) pour les artefacts OpenSpec.
  Rediger proposal, design, tasks et specs en francais.
  Garder les mots cles normatifs (MUST, SHALL) en anglais si necessaire,
  mais tout le texte explicatif doit rester en francais.

rules:
  proposal:
    - Rediger 100% en francais.
  design:
    - Rediger 100% en francais.
  tasks:
    - Rediger 100% en francais.
  specs:
    - Rediger 100% en francais.

operations:
  apply:
    guidance:
      - Produire les resumes et explications en francais.
  archive:
    guidance:
      - Produire le resume d'archivage en francais.
