services:
  mysql:
    image: mysql:8.2
    container_name: mysql82
    restart: unless-stopped
    ports:
      - "3399:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fse_legacy
      MYSQL_USER: fse_legacy
      MYSQL_PASSWORD: fse_legacy
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:

